<!DOCTYPE html>
<html lang="zh-CN" class="in-pc">
<head>
<meta charset="UTF-8">
<title>面板卡片压扁复现</title>
<style>
  /* ===== 复刻 B站活动页环境 ===== */
  html, body { padding: 0; margin: 0; width: 100%; height: 100%; font-family: PingFang SC, Avenir, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  /* B站 shell 的 rem 基准：clientWidth >= 375 时恒为 100px */
  html { font-size: 100px; }
  #app { width: 100%; height: 100%; }
  .app-container { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; }
  /* B站源列表占位（仅用于撑出页面高度感） */
  .fake-list { padding: 20px; font-size: 14px; color: #61666d; }
</style>
<link rel="stylesheet" href="../extension/content.css">
<!-- 回归说明：本页复刻B站活动页环境（html font-size:100px、html/body 100%高、box-sizing）。
     曾复现的 bug：停靠面板中列表容器为 grid 且块向高度确定（flex:1），
     卡片 overflow:hidden 时 auto 行被压成等分填充（clientH==scrollH 不滚动），卡片只露一条。
     修复：content.css 的 .baf-activity-list 增加 grid-auto-rows: max-content。
     打开本页应看到右侧面板卡片完整显示、可正常滚动。 -->
</head>
<body class="baf-panel-open">
<div id="app">
  <div class="app-container">
    <div class="fake-list">
      <h2>B站原列表占位</h2>
      <p>这里是B站原有活动列表区域（复现用占位文本）。</p>
    </div>
  </div>
</div>

<div id="baf-panel" class="baf-panel">
  <div id="baf-toolbar" class="bili-activity-filter-toolbar">
    <div class="baf-header">
      <div class="baf-title"><img src="../extension/icons/icon48.png" class="baf-title-logo" alt="logo"> B站活动筛选助手</div>
      <div class="baf-header-actions">
        <button type="button" class="baf-icon-btn" id="baf-undock-btn" title="恢复页面内显示">⇤</button>
        <button type="button" class="baf-icon-btn" id="baf-close-btn" title="收起面板">✕</button>
      </div>
    </div>
    <div class="baf-stats">
      共 <strong id="baf-total">175</strong> 个活动 |
      进行中 <strong id="baf-active">175</strong> |
      本周截止 <strong id="baf-ending">56</strong> |
      筛选结果 <strong id="baf-result">175</strong>
    </div>
    <div class="baf-filter-row">
      <span class="baf-filter-label">分类</span>
      <div class="baf-filter-btns" id="baf-cat-btns">
        <span class="baf-filter-btn active" data-cat="all">全部</span>
        <span class="baf-filter-btn" data-cat="游戏">游戏</span>
        <span class="baf-filter-btn" data-cat="科技">科技</span>
        <span class="baf-filter-btn" data-cat="动画">动画</span>
      </div>
    </div>
    <div class="baf-filter-row">
      <span class="baf-filter-label">时间</span>
      <div class="baf-filter-btns" id="baf-time-btns">
        <span class="baf-filter-btn active" data-time="all">全部</span>
        <span class="baf-filter-btn" data-time="week">本周截止</span>
        <span class="baf-filter-btn" data-time="month">本月截止</span>
        <span class="baf-filter-btn" data-time="long">长期</span>
      </div>
      <span class="baf-filter-label" style="margin-left:16px;">奖励</span>
      <div class="baf-filter-btns" id="baf-reward-btns">
        <span class="baf-filter-btn active" data-reward="all">全部</span>
        <span class="baf-filter-btn" data-reward="现金瓜分">现金瓜分</span>
      </div>
    </div>
    <div class="baf-search-row">
      <input type="text" class="baf-search-input" id="baf-search" placeholder="搜索活动名称、标签..." />
      <input type="text" class="baf-video-type-input" id="baf-video-type" placeholder="我的视频类型（如：影视解说）" />
      <select class="baf-select" id="baf-sort">
        <option value="days-asc" selected>截止时间（近→远）</option>
        <option value="days-desc">截止时间（远→近）</option>
      </select>
    </div>
  </div>

  <div id="baf-activity-list" class="baf-activity-list"></div>
</div>

<script>
  // 与 content.js renderActivityList 相同结构的卡片
  const cards = [
    { title: '哔哩哔哩嗶瓦次元11月征稿', cats: ['游戏'], tags: ['游戏', '射击游戏'], days: 3, reward: '现金瓜分：总奖池10万元', match: 0 },
    { title: '伊莫1.1版本激励计划', cats: ['游戏'], tags: ['伊莫', '激励计划'], days: 13, reward: '固定奖金：单条最高500元', match: 0 },
    { title: '剑网3"苍生铸世"创作激励计划', cats: ['游戏'], tags: ['苍生铸世'], days: 14, reward: '流量扶持：首页推荐位', match: 0 },
    { title: '京东11.11，UP课课代表表头抄好价', cats: ['科技'], tags: ['京东', '双十一'], days: 4, reward: '现金瓜分：总奖池5万元', match: 82 },
    { title: '启境GX7洞五座智能百变 SUV', cats: ['科技'], tags: ['启境汽车', 'GX7'], days: 4, reward: '固定奖金：2000元', match: 0 },
    { title: '《深空当铺》创作者激励计划', cats: ['影视'], tags: ['深空当铺'], days: 2, reward: '现金瓜分：总奖池20万元', match: 64 },
    { title: '双11抄作业，这张卡先加购', cats: ['科技'], tags: ['中国银行联名', '双十一'], days: 3, reward: '流量扶持：商单曝光', match: 0 },
    { title: '一嚼异能爆棚 根本停不下来', cats: ['动画'], tags: ['异能爆棚', '炫迈联创'], days: 0, reward: '现金瓜分：瓜分1万元', match: 0 },
    { title: '联名2AIMV大赛', cats: ['音乐'], tags: ['音乐', 'AI音乐', 'AIGC', 'MV'], days: 2, reward: '固定奖金：3000元', match: 91 },
    { title: '社会切片计划4.0', cats: ['知识'], tags: ['知识', '纪实', '卖拍'], days: 5, reward: '流量扶持：知识区推荐', match: 0 },
    { title: '学习副本通关计划', cats: ['知识'], tags: ['校园学习', '流量扶持'], days: 5, reward: '现金瓜分：总奖池3万元', match: 0 },
    { title: '王者万象棋S1创作激励', cats: ['游戏'], tags: ['40万奖金', '游戏道具'], days: 2, reward: '固定奖金：最高5000元', match: 0 }
  ];

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  document.getElementById('baf-activity-list').innerHTML = cards.map(a => {
    const isEndingSoon = a.days <= 7;
    const catIcon = { icon: '🎮', bg: '#f0f5ff', color: '#2f54eb', label: a.cats[0] };
    const matchBadge = a.match > 70
      ? `<span class="baf-badge baf-badge-match" style="display:inline-block;">⭐ 高度匹配 ${a.match}%</span>`
      : a.match > 30
        ? `<span class="baf-badge baf-badge-mid" style="display:inline-block;">🔹 中度匹配 ${a.match}%</span>`
        : '';
    return `
      <div class="baf-activity-item" data-url="https://example.com" data-id="0">
        <button class="baf-fav-btn" title="收藏此活动">☆</button>
        ${isEndingSoon ? `<div class="baf-ending-wrap"><span class="baf-ending-badge">⏰ ${a.days === 0 ? '今天截止' : `${a.days}天后截止`}</span></div>` : ''}
        <div class="baf-cat-badge" style="background:${catIcon.bg};color:${catIcon.color};" title="${esc(catIcon.label)}">${catIcon.icon}</div>
        <div class="baf-activity-item-title">${esc(a.title)}</div>
        <div class="baf-activity-item-cats">
          ${a.cats.map(c => `<span class="baf-cat-tag" style="background:#f0f5ff;color:#2f54eb;">${esc(c)}</span>`).join('')}
        </div>
        <div class="baf-activity-item-tags">
          ${a.tags.slice(0, 4).map(t => `<span class="baf-activity-item-tag">${esc(t)}</span>`).join('')}
        </div>
        <div class="baf-activity-item-info">
          📅 2026-10-29 - 2026-12-09<br>
          🏷️ ${esc(a.tags[0])}<br>
          📂 游戏区
        </div>
        <div class="baf-activity-item-reward">💰 ${esc(a.reward)}</div>
        ${matchBadge ? `<div class="baf-match-wrap">${matchBadge}</div>` : ''}
        <div class="baf-activity-item-footer">
          <span class="${a.days <= 7 ? 'baf-days-urgent' : 'baf-days-normal'}">${a.days === 0 ? '今天截止' : `剩余${a.days}天`}</span>
          <span style="color:#fb7299;">点击投稿 →</span>
        </div>
      </div>
    `;
  }).join('');
</script>
<script>
  // ===== 布局诊断：把第一张卡片的 computed style 全部打出来 =====
  window.addEventListener('load', () => {
    const item = document.querySelector('.baf-activity-item');
    const list = document.getElementById('baf-activity-list');
    const panel = document.getElementById('baf-panel');
    const cs = getComputedStyle(item);
    const lines = [];
    lines.push(`panel: h=${panel.clientHeight} display=${getComputedStyle(panel).display}`);
    lines.push(`list: clientH=${list.clientHeight} scrollH=${list.scrollHeight} display=${getComputedStyle(list).display} overflowY=${getComputedStyle(list).overflowY} rows=${getComputedStyle(list).gridTemplateRows}`);
    lines.push(`item: offsetH=${item.offsetHeight} display=${cs.display} overflow=${cs.overflow} h=${cs.height} minH=${cs.minHeight}`);
    for (const child of item.children) {
      const s = getComputedStyle(child);
      lines.push(`  <${child.className || child.tagName}> offsetH=${child.offsetHeight} display=${s.display} fs=${s.fontSize} lh=${s.lineHeight} h=${s.height} pos=${s.position}`);
    }
    const pre = document.createElement('pre');
    pre.id = 'baf-diag';
    pre.style.cssText = 'position:fixed;left:10px;top:10px;z-index:99999;background:#fffbe6;border:1px solid #faad14;padding:8px;font-size:11px;line-height:1.5;max-width:620px;white-space:pre-wrap;color:#333;';
    pre.textContent = lines.join('\n');
    document.body.appendChild(pre);
  });
</script>
</body>
</html>
